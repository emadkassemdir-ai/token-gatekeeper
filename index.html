<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VoxelCraft Engine</title>
    <!-- Pixel fonts for the Minecraft look (free, OFL-licensed; falls back to
         monospace if unavailable). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        --accent: #6cc24a;
        --accent-dark: #4a8a30;
        --panel: rgba(18, 20, 24, 0.92);
        /* Bottom inset for the iPad home indicator / iOS gesture bar. Falls
           back to 0 on platforms without a safe area. */
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --pixel-font: 'VT323', 'Courier New', monospace;
        --title-font: 'Press Start 2P', 'VT323', monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0c10;
        font-family: var(--pixel-font);
        font-size: 18px;
        color: #f5f5f5;
        user-select: none;
        cursor: default;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Crosshair shown while the world is active. */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 22px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
        z-index: 30;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
      }
      #crosshair::before {
        left: 50%;
        top: 0;
        width: 2px;
        height: 100%;
        transform: translateX(-50%);
      }
      #crosshair::after {
        top: 50%;
        left: 0;
        height: 2px;
        width: 100%;
        transform: translateY(-50%);
      }
      #crosshair.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="crosshair"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
