<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- ============================ SEO ============================ -->
    <title>VoxelCraft — Free Minecraft-Style Game in Your Browser (No Download)</title>
    <meta name="description" content="Play VoxelCraft free in your browser: an infinite 3D voxel sandbox with survival and creative modes, crafting, mining, villages, the Nether and the End, bosses, redstone, and 4-player online multiplayer. No download, no install — works on desktop, tablet and phone." />
    <meta name="keywords" content="voxelcraft, voxel craft, free browser minecraft, block game, voxel game, sandbox game, crafting game, minecraft in browser, no download, multiplayer block game" />
    <meta name="author" content="VoxelCraft" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://playvoxelcraft.com/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Social previews (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VoxelCraft" />
    <meta property="og:title" content="VoxelCraft — Free Minecraft-Style Game in Your Browser" />
    <meta property="og:description" content="Infinite voxel sandbox: survival, crafting, villages, the Nether &amp; the End, bosses, redstone and online multiplayer — free, right in your browser." />
    <meta property="og:url" content="https://playvoxelcraft.com/" />
    <meta property="og:image" content="https://playvoxelcraft.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VoxelCraft — Free Minecraft-Style Game in Your Browser" />
    <meta name="twitter:description" content="Infinite voxel sandbox with survival, crafting, bosses and multiplayer. Play free, no download." />
    <meta name="twitter:image" content="https://playvoxelcraft.com/og-image.png" />

    <!-- Structured data so search engines list this as a playable game -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "VoxelCraft",
      "url": "https://playvoxelcraft.com/",
      "image": "https://playvoxelcraft.com/og-image.png",
      "description": "A free Minecraft-style voxel sandbox that runs entirely in the browser: infinite worlds, survival and creative modes, crafting, villages, the Nether and the End, boss fights, redstone and 4-player online multiplayer.",
      "genre": ["Sandbox", "Survival", "Crafting"],
      "playMode": ["SinglePlayer", "MultiPlayer"],
      "applicationCategory": "Game",
      "operatingSystem": "Web browser",
      "gamePlatform": ["Web", "Desktop", "Mobile"],
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <!-- ============================================================= -->
    <!-- Pixel fonts for the Minecraft look (free, OFL-licensed; falls back to
         monospace if unavailable). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        --accent: #6cc24a;
        --accent-dark: #4a8a30;
        --panel: rgba(18, 20, 24, 0.92);
        /* Bottom inset for the iPad home indicator / iOS gesture bar. Falls
           back to 0 on platforms without a safe area. */
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --pixel-font: 'VT323', 'Courier New', monospace;
        --title-font: 'Press Start 2P', 'VT323', monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0c10;
        font-family: var(--pixel-font);
        font-size: 18px;
        color: #f5f5f5;
        user-select: none;
        cursor: default;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Crosshair shown while the world is active. */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 22px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
        z-index: 30;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
      }
      #crosshair::before {
        left: 50%;
        top: 0;
        width: 2px;
        height: 100%;
        transform: translateX(-50%);
      }
      #crosshair::after {
        top: 50%;
        left: 0;
        height: 2px;
        width: 100%;
        transform: translateY(-50%);
      }
      #crosshair.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="crosshair"></div>
    </div>
    <!-- Crawlable description for engines that don't execute JavaScript. -->
    <noscript>
      <h1>VoxelCraft — a free Minecraft-style game in your browser</h1>
      <p>VoxelCraft is a free 3D voxel sandbox game that runs entirely in your web
      browser — no download and no install. Explore infinite procedurally generated
      worlds, mine ores, craft tools and armour, farm, trade with villagers, fight
      zombies, creepers and skeletons, light a Nether portal, defeat the Ender
      Dragon and the Wither, build with redstone, and play online with up to four
      friends. VoxelCraft works on desktop, tablets and phones. Enable JavaScript
      to play.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
